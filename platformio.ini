; PlatformIO configuration for the NUCLEO-F439ZI using STM32Cube HAL.

[env:nucleo_f439zi]

platform = ststm32
board = nucleo_f439zi
framework = stm32cube

; Upload using the board's on-board ST-LINK debugger/programmer.
upload_protocol = stlink

; USART3 is connected to the ST-LINK Virtual COM Port.
monitor_speed = 115200

; Enable floating-point formatting in printf(), for example printf("%f", x).
build_flags =
    -Wl,-u_printf_float
