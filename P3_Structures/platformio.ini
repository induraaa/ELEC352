; --------------------------------------------------
; PlatformIO configuration for the NUCLEO-F439ZI
; using the STM32Cube HAL framework
; --------------------------------------------------

[env:nucleo_f439zi]

; STM32 PlatformIO platform
platform = ststm32

; Target development board
board = nucleo_f439zi

; Use the STM32Cube Hardware Abstraction Layer (HAL)
framework = stm32cube


; --------------------------------------------------
; Upload configuration
; --------------------------------------------------

; Upload using the on-board ST-LINK debugger/programmer
upload_protocol = stlink


; --------------------------------------------------
; Serial monitor configuration
; --------------------------------------------------

; USART3 is connected to the ST-LINK Virtual COM Port.
; PlatformIO normally detects the current USB serial port automatically.
monitor_speed = 115200


; --------------------------------------------------
; Build options
; --------------------------------------------------

; Enable floating-point formatting with printf(), for example printf("%f", x).
build_flags =
    -Wl,-u_printf_float
